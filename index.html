<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>موقع عن قصة حياة ام كلثوم</title>
<style>:root {
  --ios-bg: #f2f2f7;
  --ios-card: rgba(255, 255, 255, 0.85);
  --ios-accent: #007aff;
  --ios-text: #000000;
  --ios-blur: blur(20px);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
  background-color: var(--ios-bg);
  color: var(--ios-text);
  direction: rtl;
  overflow-x: hidden;
}

.ios-container {
  max-width: 500px;
  margin: 0 auto;
  background: var(--ios-bg);
  min-height: 100vh;
  padding-bottom: 100px;
  position: relative;
}

/* iOS 26 Glassmorphism Header */
.ios-header {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 10px 20px 20px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.ios-header.glass {
  background: var(--ios-card);
  backdrop-filter: var(--ios-blur);
  border-bottom: 0.5px solid rgba(0,0,0,0.1);
}

.status-bar {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 15px;
}

.nav-main {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-main h1 {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -1px;
}

.profile-badge {
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, #af52de, #5856d6);
  border-radius: 50%;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

/* Content Layout */
.ios-content {
  padding: 20px;
}

.hero-card {
  height: 400px;
  background: url('https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&q=80') center;
  background-size: cover;
  border-radius: 30px;
  margin-bottom: 25px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}

.hero-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 30px;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
  color: white;
}

.badge {
  background: var(--ios-accent);
  padding: 4px 12px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
}

.hero-overlay h2 {
  font-size: 28px;
  margin: 10px 0;
}

.ios-btn-primary {
  background: white;
  color: black;
  border: none;
  padding: 12px 25px;
  border-radius: 20px;
  font-weight: 700;
  margin-top: 15px;
  cursor: pointer;
  transition: transform 0.2s;
}

.ios-btn-primary:active {
  transform: scale(0.95);
}

/* Stats Grid */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 25px;
}

.stat-card {
  background: var(--ios-card);
  backdrop-filter: var(--ios-blur);
  padding: 20px;
  border-radius: 24px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.3);
}

.stat-card h3 {
  font-size: 24px;
  color: var(--ios-accent);
}

/* Tabs UI */
.ios-tabs {
  display: flex;
  background: rgba(0,0,0,0.05);
  padding: 5px;
  border-radius: 15px;
  margin-bottom: 20px;
  justify-content: space-around;
}

.ios-tabs button {
  flex: 1;
  border: none;
  background: transparent;
  padding: 10px;
  border-radius: 12px;
  font-size: 20px;
  cursor: pointer;
  transition: all 0.3s;
}

.ios-tabs button.active {
  background: white;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

.ios-detail-card {
  background: var(--ios-card);
  padding: 25px;
  border-radius: 30px;
  margin-bottom: 25px;
  min-height: 200px;
  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Extensive Bio */
.ios-card {
  background: white;
  padding: 25px;
  border-radius: 30px;
  margin-bottom: 20px;
}

.ios-card h3 {
  margin-bottom: 15px;
  font-size: 22px;
}

.ios-card p {
  line-height: 1.8;
  color: #333;
  margin-bottom: 15px;
}

/* Footer Tab Bar */
.ios-tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  height: 85px;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(25px);
  display: flex;
  justify-content: space-around;
  align-items: center;
  border-top: 0.5px solid rgba(0,0,0,0.1);
  padding-bottom: 20px;
}

.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 11px;
  color: #8e8e93;
}

.tab-item.active {
  color: var(--ios-accent);
}

.tab-item span:first-child {
  font-size: 24px;
  margin-bottom: 4px;
}

/* Large Screens */
@media (min-width: 501px) {
  body {
    background: #000;
  }
}
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
import React, { useState, useEffect } from 'react';
import './styles.css';

const sections = [
  {
    id: 'origin',
    title: 'الجذور والنشأة',
    icon: '🌱',
    content: 'في قرية طماي الزهايرة، ولدت الأسطورة. بدأت كطفلة تنشد في الموالد بزي بدوي، حيث اكتشف والدها الشيخ إبراهيم البلتاجي قوة صوتها الفطرية التي كانت تهز جدران المساجد والبيوت الريفية. لم تكن مجرد موهبة، بل كانت ظاهرة صوتية نادرة تتشكل في أحضان الريف المصري.'
  },
  {
    id: 'golden',
    title: 'العصر الذهبي',
    icon: '🎭',
    content: 'انتقلت للقاهرة لتبدأ رحلة الصعود. من مسارح عماد الدين إلى قمة الهرم الغنائي. شكلت مع أحمد رامي ومحمد القصبجي مدرسة فنية جديدة غيرت وجه الموسيقى العربية. غنت القصيدة الفصحى والزجل العامي بقدرة مذهلة على التعبير، مما جعلها "شخصية العام" في كل زمان.'
  },
  {
    id: 'national',
    title: 'الدور الوطني',
    icon: '🇪🇬',
    content: 'لم تكن صوتاً فحسب، بل كانت جيشاً كاملاً. بعد نكسة 1967، طافت العالم لجمع التبرعات للمجهود الحربي. من باريس إلى الكويت، كانت أم كلثوم رمزاً للصمود المصري، حيث استُقبلت كملكة ورئيسة دولة، مؤكدة أن الفن هو السلاح الأقوى في وقت المحن.'
  },
  {
    id: 'legacy',
    title: 'الإرث الخالد',
    icon: '✨',
    content: 'رحلت الست جسداً وبقيت صوتاً لا يغيب. ما زالت حفلاتها التي تُبث في منتصف الليل طقساً مقدساً للملايين. أصبحت نظارتها السوداء ومنديلها الحريري أيقونات عالمية تدرس في تاريخ الموضة والفهم العميق للكاريزما الفنية.'
  }
];

const stats = [
  { label: 'أغنية', value: '300+' },
  { label: 'سنة غناء', value: '50+' },
  { label: 'حضور جنازة', value: '4M+' },
  { label: 'جوائز دولية', value: '15' }
];

var App = function App() {
  const [activeTab, setActiveTab] = useState('origin');
  const [scrolled, setScrolled] = useState(false);

  useEffect(() => {
    const handleScroll = () => setScrolled(window.scrollY > 20);
    window.addEventListener('scroll', handleScroll);
    return () => window.removeEventListener('scroll', handleScroll);
  }, []);

  return (
    <div className="ios-container">
      {/* Dynamic Header UI for iOS 26 */}
      <header className={`ios-header ${scrolled ? 'glass' : ''}`}>
        <div className="status-bar">
          <span className="time">9:41</span>
          <div className="status-icons">
            <span className="signal">📶</span>
            <span className="battery">🔋</span>
          </div>
        </div>
        <nav className="nav-main">
          <h1>كوكب الشرق</h1>
          <div className="profile-badge">UK</div>
        </nav>
      </header>

      <main className="ios-content">
        {/* Dynamic Hero Section */}
        <section className="hero-card">
          <div className="hero-overlay">
            <span className="badge">Featured</span>
            <h2>أسطورة الغناء العربي</h2>
            <p>رحلة في حياة السيدة التي وحدت العرب بصوتها</p>
            <button className="ios-btn-primary">استمع الآن</button>
          </div>
        </section>

        {/* Dynamic Stats Grid */}
        <section className="stats-grid">
          {stats.map((stat, i) => (
            <div key={i} className="stat-card">
              <h3>{stat.value}</h3>
              <p>{stat.label}</p>
            </div>
          ))}
        </section>

        {/* Content Tabs - iOS 26 Style */}
        <section className="content-explorer">
          <div className="ios-tabs">
            {sections.map(s => (
              <button 
                key={s.id}
                className={activeTab === s.id ? 'active' : ''}
                onClick={() => setActiveTab(s.id)}
              >
                {s.icon}
              </button>
            ))}
          </div>
          
          <div className="ios-detail-card">
            <h2>{sections.find(s => s.id === activeTab).title}</h2>
            <p>{sections.find(s => s.id === activeTab).content}</p>
          </div>
        </section>

        {/* Long Text Body - Detailed Biography */}
        <section className="bio-extensive">
          <div className="ios-card">
            <h3>التفاصيل الموسيقية والتقنية</h3>
            <p>
              تعتبر أم كلثوم صاحبة "صوت كونترالتو" قوي، وهو أغلظ صوت نسائي، لكنها كانت تتنقل بين الطبقات بمهارة "السوبرانو". 
              تميزت بطول النفس الاستثنائي الذي كان يسمح لها بإعادة الكوبليه الواحد لأكثر من عشرين مرة بتلوينات مقامية مختلفة دون كلل. 
              تعاملت مع عمالقة التلحين مثل رياض السنباطي الذي قدم لها "الأطلال" والتي تعتبر "تاج الأغنية العربية"، 
              وبليغ حمدي الذي نقلها إلى روح العصر بـ "حب إيه" و "ألف ليلة وليلة".
            </p>
            <p>
              علاقتها بالجمهور لم تكن علاقة مطربة بمستمعين، بل كانت علاقة وجدانية. كانت تقرأ وجوه الحاضرين في مسرح قصر النيل، 
              وتعدل في أدائها بناءً على "السلطنة" التي تراها في عيونهم. 
            </p>
          </div>
        </section>
      </main>

      {/* iOS 26 Tab Bar */}
      <footer className="ios-tab-bar">
        <div className="tab-item active">🏠<span>الرئيسية</span></div>
        <div className="tab-item">🎵<span>الأغاني</span></div>
        <div className="tab-item">📸<span>المعرض</span></div>
        <div className="tab-item">🔎<span>بحث</span></div>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
